<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catch It: Aynasiz</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: linear-gradient(180deg, #eef1fb 0%, #dfe6fa 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    overflow: hidden;
  }
  #wrap {
    position: relative;
  }
  canvas {
    display: block;
    background: #f6f8ff;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(123,92,255,0.18);
    touch-action: none;
    cursor: none;
    transform: rotate(0deg);
    filter: blur(0px);
  }
  #hud {
    position: absolute;
    top: 16px;
    left: 20px;
    right: 20px;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: #241d4f;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.5px;
    pointer-events: none;
  }
  #muteBtn {
    pointer-events: auto;
    background: rgba(255,255,255,0.6);
    border: none;
    border-radius: 999px;
    width: 34px;
    height: 34px;
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.92);
    border-radius: 12px;
    color: #241d4f;
    text-align: center;
    padding: 20px;
    box-sizing: border-box;
  }
  #overlay h1 {
    font-size: 26px;
    margin: 0 0 4px;
  }
  #overlay p {
    font-size: 14px;
    opacity: 0.75;
    margin: 4px 0 14px;
    max-width: 320px;
  }
  #overlay .score-line {
    font-size: 17px;
    margin-bottom: 18px;
    opacity: 0.9;
  }
  .band-logo {
    width: 84px;
    height: 84px;
    border-radius: 16px;
    object-fit: cover;
    box-shadow: 0 8px 20px rgba(0,0,0,0.28);
    margin-bottom: 8px;
  }
  .siren-bar {
    display: flex;
    width: 52px;
    height: 7px;
    margin: 0 0 10px;
    border-radius: 4px;
    overflow: hidden;
  }
  .siren-bar span {
    flex: 1;
  }
  .siren-bar .siren-red {
    background: #e34b4b;
    animation: sirenPulse 1.3s ease-in-out infinite;
  }
  .siren-bar .siren-blue {
    background: #3b7ddb;
    animation: sirenPulse 1.3s ease-in-out infinite 0.65s;
  }
  @keyframes sirenPulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }
  .char-grid {
    display: flex;
    flex-wrap: nowrap;
    justify-content: center;
    gap: 5px;
    max-width: 380px;
    margin: 0 0 18px;
  }
  .char-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    width: 58px;
    flex-shrink: 0;
  }
  .char-btn {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    padding: 0;
    border: 3px solid transparent;
    background: none;
    cursor: pointer;
    overflow: hidden;
    box-shadow: none;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .char-btn:hover {
    transform: translateY(0) scale(1.05);
  }
  .char-btn.selected {
    transform: scale(1.1);
  }
  .char-btn img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
    display: block;
  }
  .char-name {
    font-size: 10px;
    color: #241d4f;
    opacity: 0.7;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 62px;
  }
  button.primary {
    background: #7b5cff;
    color: white;
    border: none;
    padding: 12px 28px;
    font-size: 16px;
    font-weight: 700;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(123,92,255,0.45);
    transition: transform 0.15s ease;
  }
  button.primary:hover { transform: translateY(-2px); }
  button.text-link {
    background: none;
    border: none;
    color: #7b5cff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
    padding: 4px;
  }
  .hidden { display: none !important; }
</style>

  // ---- Audio: master chain + mute ----
  let audioCtx = null;
  let masterGain = null;
  let muted = false;

  function getAudioCtx() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
    }
    return audioCtx;
  }

  function getMasterGain() {
    var ac = getAudioCtx();
    if (!masterGain) {
      masterGain = ac.createGain();
      masterGain.gain.value = muted ? 0 : 1;
      masterGain.connect(ac.destination);
    }
    return masterGain;
  }

  function toggleMute() {
    muted = !muted;
    if (masterGain) masterGain.gain.value = muted ? 0 : 1;
    if (currentMusicAudio) currentMusicAudio.muted = muted;
    if (lobbyAudio) lobbyAudio.muted = muted;
    var btn = document.getElementById('muteBtn');
    if (btn) btn.textContent = muted ? '🔇' : '🔊';
  }

  // ---- SFX ----
  function playTone(freq, duration, type, startOffset, peak) {
    var ac = getAudioCtx();
    var osc = ac.createOscillator();
    var gain = ac.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    var t0 = ac.currentTime + (startOffset || 0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime(peak || 0.2, t0 + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(gain);
    gain.connect(getMasterGain());
    osc.start(t0);
    osc.stop(t0 + duration + 0.03);
  }

  function playCatchSound() {
    playTone(660, 0.1, 'sine', 0, 0.18);
    playTone(920, 0.12, 'sine', 0.04, 0.14);
  }

  function playDieSound() {
    playTone(240, 0.28, 'sawtooth', 0, 0.18);
    playTone(170, 0.3, 'sawtooth', 0.14, 0.16);
    playTone(110, 0.4, 'sawtooth', 0.28, 0.14);
  }

  function playLifeUpSound() {
    playTone(523, 0.12, 'sine', 0, 0.2);
    playTone(659, 0.12, 'sine', 0.06, 0.19);
    playTone(784, 0.18, 'sine', 0.12, 0.2);
  }

  // ---- Character background music (real tracks, one per character, looped) ----
  // Files live alongside index.html in a music/ folder.
  const MUSIC_FILES = {
    mad: 'music/onat.mp3',            // Onat
    bassist_black: 'music/ozi.mp3',   // Ozi
    guitarist_green: 'music/batin.mp3', // Batin
    bassist_yellow: 'music/emre.mp3', // Emre
    sax_teal: 'music/cem.mp3'         // Cem
  };
  let currentMusicAudio = null;
  let lobbyAudio = null;

  function startMusic(charId) {
    stopLobbyMusic();
    stopMusic();
    var file = MUSIC_FILES[charId];
    if (!file) return;
    var audioEl = new Audio(file);
    audioEl.loop = true;
    audioEl.volume = 0.55;
    audioEl.muted = muted;
    audioEl.play().catch(function() { /* ignored: browser may block until a user gesture, startGame() is one */ });
    currentMusicAudio = audioEl;
  }

  function stopMusic() {
    if (currentMusicAudio) {
      currentMusicAudio.pause();
      currentMusicAudio.currentTime = 0;
      currentMusicAudio = null;
    }
  }

  // Lobby/wait-screen loop: plays on character select and game-over screens.
  function playLobbyMusic() {
    stopMusic();
    if (!lobbyAudio) {
      lobbyAudio = new Audio('music/lobby.mp3');
      lobbyAudio.loop = true;
      lobbyAudio.volume = 0.4;
    }
    lobbyAudio.muted = muted;
    lobbyAudio.play().catch(function() { /* ignored: blocked until a user gesture happens */ });
  }

  function stopLobbyMusic() {
    if (lobbyAudio) lobbyAudio.pause();
  }

  function charById(id) {
    for (var i = 0; i < CHARACTERS.length; i++) if (CHARACTERS[i].id === id) return CHARACTERS[i];
    return CHARACTERS[0];
  }

  function renderSelectScreen() {
    playLobbyMusic();
    var html = BRAND_HEADER;
    html += '<h1>Catch It: Aynasiz</h1>';
    html += '<p>Pick your player, then catch the beers falling from space.</p>';
    html += '<div class="char-grid" id="charGrid">';
    CHARACTERS.forEach(function(c, i) {
      var sel = c.id === selectedCharId ? ' selected' : '';
      var border = c.id === selectedCharId ? c.ring : 'transparent';
      html += '<div class="char-item">' +
        '<button class="char-btn' + sel + '" data-char="' + c.id + '" style="border-color:' + border + '">' +
        '<img src="' + c.src + '" alt="' + c.name + '"></button>' +
        '<span class="char-name">' + c.name + '</span></div>';
    });
    html += '</div>';
    html += '<button class="primary" id="startBtn">Start Game</button>';
    overlay.innerHTML = html;

    var buttons = overlay.querySelectorAll('.char-btn');
    buttons.forEach(function(btn) {
      btn.addEventListener('click', function() {
        playLobbyMusic(); // retry in case autoplay was blocked on initial load; this click is a real user gesture
        selectedCharId = btn.getAttribute('data-char');
        buttons.forEach(function(b) {
          b.classList.remove('selected');
          b.style.borderColor = 'transparent';
        });
        btn.classList.add('selected');
        btn.style.borderColor = charById(selectedCharId).ring;
      });
    });

    document.getElementById('startBtn').addEventListener('click', startGame);
  }

  function resetGame() {
    items = [];
    score = 0;
    lives = 3;
    spawnTimer = 0;
    spawnInterval = 85;
    elapsedFrames = 0;
    catcher.x = W / 2;
    canvas.style.transform = 'rotate(0deg)';
    canvas.style.filter = 'blur(0px) hue-rotate(0deg)';
    updateHud();
  }

  function updateHud() {
    scoreLabel.textContent = 'Score: ' + score;
    livesLabel.textContent = 'Lives: ' + '❤️'.repeat(Math.max(lives, 0));
  }

  function spawnItem() {
    const r = 18 + Math.random() * 6;
    const difficulty = Math.min(score, 55); // ramps with points scored, caps out so it stays playable
    const speed = 0.9 + Math.random() * 0.5 + difficulty * 0.045;
    const base = {
      x: r + Math.random() * (W - 2 * r),
      y: -r * 2.4,
      r: r,
      speed: speed
    };
    if (Math.random() < BURGER_CHANCE) {
      items.push(Object.assign(base, { kind: 'burger', ratio: BURGER_RATIO }));
    } else {
      const beer = BEERS[Math.floor(Math.random() * BEERS.length)];
      items.push(Object.assign(base, { kind: 'beer', beerId: beer.id, ratio: beer.ratio }));
    }
  }

  function drawCatcher() {
    const img = avatarImages[selectedCharId];
    const char = charById(selectedCharId);
    ctx.save();
    ctx.beginPath();
    ctx.arc(catcher.x, catcher.y, catcher.r, 0, Math.PI * 2);
    ctx.closePath();
    ctx.clip();
    if (img && img.complete && img.naturalWidth > 0) {
      ctx.drawImage(img, catcher.x - catcher.r, catcher.y - catcher.r, catcher.r * 2, catcher.r * 2);
    } else {
      ctx.fillStyle = '#c8d6ff';
      ctx.fillRect(catcher.x - catcher.r, catcher.y - catcher.r, catcher.r * 2, catcher.r * 2);
    }
    ctx.restore();
    ctx.beginPath();
    ctx.arc(catcher.x, catcher.y, catcher.r, 0, Math.PI * 2);
    ctx.lineWidth = 4;
    ctx.strokeStyle = char.ring;
    ctx.stroke();
  }

  function drawShape(item) {
    const img = item.kind === 'burger' ? burgerImage : beerImages[item.beerId];
    const drawH = item.r * 2.6;
    const drawW = drawH * item.ratio;
    if (img && img.complete && img.naturalWidth > 0) {
      ctx.drawImage(img, item.x - drawW / 2, item.y - drawH / 2, drawW, drawH);
    } else {
      ctx.fillStyle = '#7b5cff';
      ctx.beginPath();
      ctx.arc(item.x, item.y, item.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawStars() {
    stars.forEach(function(s) {
      ctx.fillStyle = 'rgba(123,92,255,' + (s.a * 0.5) + ')';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r * 1.6, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  function update() {
    elapsedFrames++;

    if (keys.left) catcher.x -= catcher.speed;
    if (keys.right) catcher.x += catcher.speed;
    catcher.x = Math.max(catcher.r, Math.min(W - catcher.r, catcher.x));

    spawnTimer++;
    const currentInterval = Math.max(38, spawnInterval - score * 1.4);
    if (spawnTimer >= currentInterval) {
      spawnTimer = 0;
      spawnItem();
    }

    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      it.y += it.speed;

      const dx = it.x - catcher.x;
      const dy = it.y - catcher.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const caught = dist < catcher.r + it.r * 0.6;

      if (caught) {
        if (it.kind === 'burger') {
          lives = Math.min(lives + 1, LIFE_CAP);
          playLifeUpSound();
        } else {
          score++;
          playCatchSound();
        }
        items.splice(i, 1);
        updateHud();
      } else if (it.y - it.r > H) {
        items.splice(i, 1);
        if (it.kind !== 'burger') {
          lives--;
          updateHud();
          if (lives <= 0) {
            playDieSound();
            endGame();
            return;
          }
        }
      }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    drawStars();
    items.forEach(drawShape);
    drawCatcher();
    applyDizzy();
  }

  function applyDizzy() {
    // Screen gets a bit "drunk" the more points you rack up: subtle wobble + blur/hue sway.
    // Capped so it stays readable/playable even at high scores.
    const dizzy = Math.min(score / 40, 1);
    if (dizzy <= 0) return;
    const wobbleAngle = Math.sin(elapsedFrames * 0.045) * dizzy * 3.2;
    const wobbleSkew = Math.sin(elapsedFrames * 0.03 + 1.3) * dizzy * 1.6;
    const blurAmt = dizzy * 1.1;
    const hueAmt = Math.sin(elapsedFrames * 0.02) * dizzy * 8;
    canvas.style.transform = 'rotate(' + wobbleAngle.toFixed(2) + 'deg) skewX(' + wobbleSkew.toFixed(2) + 'deg)';
    canvas.style.filter = 'blur(' + blurAmt.toFixed(2) + 'px) hue-rotate(' + hueAmt.toFixed(1) + 'deg)';
  }

  function loop() {
    if (!running) return;
    update();
    if (!running) return;
    draw();
    requestAnimationFrame(loop);
  }

  function startGame() {
    var ac = getAudioCtx();
    if (ac.state === 'suspended') ac.resume();
    resetGame();
    overlay.classList.add('hidden');
    running = true;
    startMusic(selectedCharId);
    requestAnimationFrame(loop);
  }

  function endGame() {
    running = false;
    playLobbyMusic();
    canvas.style.transform = 'rotate(0deg)';
    canvas.style.filter = 'blur(0px) hue-rotate(0deg)';
    overlay.classList.remove('hidden');
    var html = BRAND_HEADER;
    html += '<h1>Game Over</h1>';
    html += '<p class="score-line">Final score: ' + score + '</p>';
    html += '<button class="primary" id="restartBtn">Play Again</button>';
    html += '<br><button class="text-link" id="changeBtn">Change player</button>';
    overlay.innerHTML = html;
    document.getElementById('restartBtn').addEventListener('click', startGame);
    document.getElementById('changeBtn').addEventListener('click', renderSelectScreen);
  }

  // Mouse control
  canvas.addEventListener('mousemove', function(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = W / rect.width;
    const mx = (e.clientX - rect.left) * scaleX;
    catcher.x = Math.max(catcher.r, Math.min(W - catcher.r, mx));
  });

  // Touch control
  canvas.addEventListener('touchmove', function(e) {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const scaleX = W / rect.width;
    const tx = (e.touches[0].clientX - rect.left) * scaleX;
    catcher.x = Math.max(catcher.r, Math.min(W - catcher.r, tx));
  }, { passive: false });

  // Keyboard control
  window.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowLeft') keys.left = true;
    if (e.key === 'ArrowRight') keys.right = true;
  });
  window.addEventListener('keyup', function(e) {
    if (e.key === 'ArrowLeft') keys.left = false;
    if (e.key === 'ArrowRight') keys.right = false;
  });

  updateHud();
  renderSelectScreen();
})();
</script>
</body>
</html>
