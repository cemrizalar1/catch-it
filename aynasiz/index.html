<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catch It: Aynasiz</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: linear-gradient(180deg, #eef1fb 0%, #dfe6fa 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    overflow: hidden;
  }
  #wrap {
    position: relative;
  }
  canvas {
    display: block;
    background: #f6f8ff;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(123,92,255,0.18);
    touch-action: none;
    cursor: none;
  }
  #hud {
    position: absolute;
    top: 16px;
    left: 20px;
    right: 20px;
    z-index: 2;
    display: flex;
    justify-content: space-between;
    color: #241d4f;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.5px;
    pointer-events: none;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.92);
    border-radius: 12px;
    color: #241d4f;
    text-align: center;
    padding: 20px;
    box-sizing: border-box;
  }
  #overlay h1 {
    font-size: 28px;
    margin: 0 0 4px;
  }
  #overlay p {
    font-size: 14px;
    opacity: 0.75;
    margin: 4px 0 14px;
    max-width: 320px;
  }
  #overlay .score-line {
    font-size: 17px;
    margin-bottom: 18px;
    opacity: 0.9;
  }
  .char-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    max-width: 340px;
    margin: 0 0 18px;
  }
  .char-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    width: 62px;
  }
  .char-btn {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    padding: 0;
    border: 3px solid transparent;
    background: none;
    cursor: pointer;
    overflow: hidden;
    box-shadow: none;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .char-btn:hover {
    transform: translateY(0) scale(1.05);
  }
  .char-btn.selected {
    transform: scale(1.1);
  }
  .char-btn img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
    display: block;
  }
  .char-name {
    font-size: 10px;
    color: #241d4f;
    opacity: 0.7;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 62px;
  }
  button.primary {
    background: #7b5cff;
    color: white;
    border: none;
    padding: 12px 28px;
    font-size: 16px;
    font-weight: 700;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(123,92,255,0.45);
    transition: transform 0.15s ease;
  }
  button.primary:hover { transform: translateY(-2px); }
  button.text-link {
    background: none;
    border: none;
    color: #7b5cff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
    padding: 4px;
  }
  .hidden { display: none !important; }
</style>
</head>

  </div>
  <div id="overlay"></div>
</div>

  const avatarImages = {};
  CHARACTERS.forEach(function(c) {
    const img = new Image();
    img.src = c.src;
    avatarImages[c.id] = img;
  });

  let selectedCharId = CHARACTERS[0].id;

  const catcher = { x: W / 2, y: H - 54, r: 40, speed: 8 };
  let items = [];
  let score = 0;
  let lives = 3;
  let running = false;
  let spawnTimer = 0;
  let spawnInterval = 70;
  let elapsedFrames = 0;
  let keys = { left: false, right: false };

  const spaceEmoji = ['🚀', '🪐', '🌟', '👽', '☄️', '🌙', '🛸'];

  const stars = Array.from({ length: 60 }, function() {
    return {
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.4 + 0.3,
      a: Math.random() * 0.5 + 0.3
    };
  });

  function charById(id) {
    for (var i = 0; i < CHARACTERS.length; i++) if (CHARACTERS[i].id === id) return CHARACTERS[i];
    return CHARACTERS[0];
  }

  function renderSelectScreen() {
    var html = '<h1>Catch It: Aynasiz</h1>';
    html += '<p>Pick your player, then catch what falls from space.</p>';
    html += '<div class="char-grid" id="charGrid">';
    CHARACTERS.forEach(function(c, i) {
      var sel = c.id === selectedCharId ? ' selected' : '';
      var border = c.id === selectedCharId ? c.ring : 'transparent';
      html += '<div class="char-item">' +
        '<button class="char-btn' + sel + '" data-char="' + c.id + '" style="border-color:' + border + '">' +
        '<img src="' + c.src + '" alt="' + c.name + '"></button>' +
        '<span class="char-name">' + c.name + '</span></div>';
    });
    html += '</div>';
    html += '<button class="primary" id="startBtn">Start Game</button>';
    overlay.innerHTML = html;

    var buttons = overlay.querySelectorAll('.char-btn');
    buttons.forEach(function(btn) {
      btn.addEventListener('click', function() {
        selectedCharId = btn.getAttribute('data-char');
        buttons.forEach(function(b) {
          b.classList.remove('selected');
          b.style.borderColor = 'transparent';
        });
        btn.classList.add('selected');
        btn.style.borderColor = charById(selectedCharId).ring;
      });
    });

    document.getElementById('startBtn').addEventListener('click', startGame);
  }

  function resetGame() {
    items = [];
    score = 0;
    lives = 3;
    spawnTimer = 0;
    spawnInterval = 70;
    elapsedFrames = 0;
    catcher.x = W / 2;
    updateHud();
  }

  function updateHud() {
    scoreLabel.textContent = 'Score: ' + score;
    livesLabel.textContent = 'Lives: ' + '❤️'.repeat(Math.max(lives, 0));
  }

  function spawnItem() {
    const r = 16 + Math.random() * 8;
    items.push({
      x: r + Math.random() * (W - 2 * r),
      y: -r,
      r: r,
      speed: 1.2 + Math.random() * 0.9 + elapsedFrames / 3600,
      emoji: spaceEmoji[Math.floor(Math.random() * spaceEmoji.length)]
    });
  }

  function drawCatcher() {
    const img = avatarImages[selectedCharId];
    const char = charById(selectedCharId);
    ctx.save();
    ctx.beginPath();
    ctx.arc(catcher.x, catcher.y, catcher.r, 0, Math.PI * 2);
    ctx.closePath();
    ctx.clip();
    if (img && img.complete && img.naturalWidth > 0) {
      ctx.drawImage(img, catcher.x - catcher.r, catcher.y - catcher.r, catcher.r * 2, catcher.r * 2);
    } else {
      ctx.fillStyle = '#c8d6ff';
      ctx.fillRect(catcher.x - catcher.r, catcher.y - catcher.r, catcher.r * 2, catcher.r * 2);
    }
    ctx.restore();
    ctx.beginPath();
    ctx.arc(catcher.x, catcher.y, catcher.r, 0, Math.PI * 2);
    ctx.lineWidth = 4;
    ctx.strokeStyle = char.ring;
    ctx.stroke();
  }

  function drawShape(item) {
    ctx.font = (item.r * 2) + 'px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(item.emoji, item.x, item.y);
  }

  function drawStars() {
    stars.forEach(function(s) {
      ctx.fillStyle = 'rgba(123,92,255,' + (s.a * 0.5) + ')';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r * 1.6, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  function update() {
    elapsedFrames++;

    if (keys.left) catcher.x -= catcher.speed;
    if (keys.right) catcher.x += catcher.speed;
    catcher.x = Math.max(catcher.r, Math.min(W - catcher.r, catcher.x));

    spawnTimer++;
    const currentInterval = Math.max(40, spawnInterval - elapsedFrames / 30);
    if (spawnTimer >= currentInterval) {
      spawnTimer = 0;
      spawnItem();
    }

    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      it.y += it.speed;

      const dx = it.x - catcher.x;
      const dy = it.y - catcher.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const caught = dist < catcher.r + it.r * 0.6;

      if (caught) {
        score++;
        items.splice(i, 1);
        updateHud();
      } else if (it.y - it.r > H) {
        lives--;
        items.splice(i, 1);
        updateHud();
        if (lives <= 0) {
          endGame();
          return;
        }
      }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    drawStars();
    items.forEach(drawShape);
    drawCatcher();
  }

  function loop() {
    if (!running) return;
    update();
    if (!running) return;
    draw();
    requestAnimationFrame(loop);
  }

  function startGame() {
    resetGame();
    overlay.classList.add('hidden');
    running = true;
    requestAnimationFrame(loop);
  }

  function endGame() {
    running = false;
    overlay.classList.remove('hidden');
    var html = '<h1>Game Over</h1>';
    html += '<p class="score-line">Final score: ' + score + '</p>';
    html += '<button class="primary" id="restartBtn">Play Again</button>';
    html += '<br><button class="text-link" id="changeBtn">Change player</button>';
    overlay.innerHTML = html;
    document.getElementById('restartBtn').addEventListener('click', startGame);
    document.getElementById('changeBtn').addEventListener('click', renderSelectScreen);
  }

  // Mouse control
  canvas.addEventListener('mousemove', function(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = W / rect.width;
    const mx = (e.clientX - rect.left) * scaleX;
    catcher.x = Math.max(catcher.r, Math.min(W - catcher.r, mx));
  });

  // Touch control
  canvas.addEventListener('touchmove', function(e) {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const scaleX = W / rect.width;
    const tx = (e.touches[0].clientX - rect.left) * scaleX;
    catcher.x = Math.max(catcher.r, Math.min(W - catcher.r, tx));
  }, { passive: false });

  // Keyboard control
  window.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowLeft') keys.left = true;
    if (e.key === 'ArrowRight') keys.right = true;
  });
  window.addEventListener('keyup', function(e) {
    if (e.key === 'ArrowLeft') keys.left = false;
    if (e.key === 'ArrowRight') keys.right = false;
  });

  updateHud();
  renderSelectScreen();
})();
</script>
</body>
</html>
